<!DOCTYPE html>

<head>
<link rel="stylesheet" href="Estelar.css"/>

<body>
  <h1>Comenta tu opinión</h1>
  <div class="form-container">
    <h2>Déjanos tu Opinión</h2>
    <p>Completa tus datos y comparte lo que piensas de el sitio web de una teletubie.</p>

    <!-- En "action" reemplaza el enlace con el vídeo de YouTube que desees -->
    <form action="https://youtu.be/n_L9yTAtvIY?si=YHOmWcdkl-akrpGh" method="GET">
      
      <div class="form-group">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="form-group">
        <label for="opinion">Opinión personal:</label>
        <textarea id="opinion" name="opinion" rows="4" placeholder="Escribe tu opinión aquí..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Enviar</button>
    </form>
  </div>
